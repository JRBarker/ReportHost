<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>ConBo Report</title>
<!--
  Results viewer for the QR code shown at the end of a ConBo session.

  The QR code holds a link to this page with the whole report after the "#". Browsers never
  send that part to the server, so the host only ever serves this fixed file and never sees
  anyone's results. Everything below runs in the learner's browser and loads nothing else.

  The report text is written by ReportGenerator.GenerateQRString in the Unity project:
    Completed 10/28/2026 3:15 PM
    Scenario Maternal Medicine Clinic
    Incomplete: one or more items could not be graded      (only when it applies)
    Item 1, Yes
    Item 2, No
  Lines this page does not recognise are shown as they are, so an older or newer format
  still displays something readable.
-->
<style>
  :root {
    --bg: #f6f7f8; --card: #ffffff; --text: #1d2730; --muted: #5a6b78; --border: #dde3e8;
    --yes: #0b7a43; --yes-bg: #e3f4ea; --no: #a8341f; --no-bg: #f9e7e3;
    --warn: #8a5a00; --warn-bg: #fff3d6; --accent: #0e7c86;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12171b; --card: #1b2228; --text: #e6ecf0; --muted: #9aabb8; --border: #2c363e;
      --yes: #5fd197; --yes-bg: #173426; --no: #f08a76; --no-bg: #3a1f1a;
      --warn: #f0c060; --warn-bg: #3a2e12; --accent: #4cc3cc;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  main { max-width: 560px; margin: 0 auto; padding: 20px 16px 40px; }
  .eyebrow { color: var(--accent); font-size: 13px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }
  h1 { font-size: 22px; margin: 4px 0 2px; }
  .meta { color: var(--muted); font-size: 14px; margin: 0 0 16px; }
  .summary {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 14px 16px; margin-bottom: 12px; display: flex; align-items: baseline; gap: 10px;
  }
  .summary b { font-size: 28px; white-space: nowrap; }
  .warn { background: var(--warn-bg); color: var(--warn); border-radius: 10px; padding: 10px 14px; margin-bottom: 12px; font-size: 14px; }
  ul { list-style: none; padding: 0; margin: 0; background: var(--card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  li { display: flex; align-items: center; gap: 12px; padding: 11px 16px; border-top: 1px solid var(--border); }
  li:first-child { border-top: 0; }
  .num { color: var(--muted); font-variant-numeric: tabular-nums; min-width: 1.6em; }
  .name { flex: 1; }
  .pill { font-size: 13px; font-weight: 600; border-radius: 999px; padding: 3px 10px; white-space: nowrap; }
  .pill.yes { color: var(--yes); background: var(--yes-bg); }
  .pill.no { color: var(--no); background: var(--no-bg); }
  .raw { color: var(--muted); font-size: 14px; }
  button {
    width: 100%; margin-top: 16px; padding: 14px; border: 0; border-radius: 12px;
    background: var(--accent); color: #fff; font: inherit; font-weight: 600; cursor: pointer;
  }
  button:active { opacity: .85; }
  .hint { color: var(--muted); font-size: 13px; text-align: center; margin-top: 10px; }
  .empty { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 18px 16px; }
</style>
</head>
<body>
<main id="app">
  <div class="eyebrow">ConBo</div>
  <h1>Consultation report</h1>
  <noscript><p class="empty">This page needs JavaScript to read the results from the link.</p></noscript>
</main>
<script>
(function () {
  // Rubric item names, numbered as in the Unity project's SO_RubricElement assets.
  var ITEMS = {
    1: "Nature of Telehealth Services", 2: "Patient Rights & Autonomy",
    3: "Communication Modalities", 4: "Technical Requirements", 5: "Privacy & Security",
    6: "Recording Technology", 7: "Confidentiality Limits", 8: "Risks & Benefits",
    9: "Disconnection Protocols", 10: "Location of Care", 11: "Licensure & Jurisdiction",
    12: "Patient Responsibilities", 13: "Therapeutic Boundaries",
    14: "Conditions for In-Person Care", 15: "Emergency Procedures", 16: "Billing & Fees",
    17: "Maternal Medicine", 18: "Checking Understanding"
  };

  var app = document.getElementById("app");

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;   // textContent only: the link is untrusted input
    return e;
  }

  // '+' stands for a space (ReportGenerator.GenerateQRPayload writes it that way to keep the
  // code small); a literal '+' arrives escaped as %2B, so this cannot mangle one.
  var hash = location.hash.replace(/^#/, "").replace(/\+/g, " ");
  var text = "";
  try { text = decodeURIComponent(hash); } catch (e) { text = hash; }

  if (!text.trim()) {
    var empty = el("p", "empty",
      "This page shows the results from the QR code at the end of a ConBo consultation. " +
      "Scan that code with your phone camera to see them here.");
    app.appendChild(empty);
    return;
  }

  var completed = "", scenario = "", incomplete = "", items = [], other = [];
  text.split(/\r?\n/).forEach(function (line) {
    line = line.trim();
    if (!line) return;
    var m;
    if ((m = line.match(/^Completed\s+(.*)$/i))) completed = m[1];
    else if ((m = line.match(/^Scenario\s+(.*)$/i))) scenario = m[1];
    else if (/^Incomplete/i.test(line)) incomplete = line;
    else if ((m = line.match(/^Item\s+(\d+)\s*,\s*(Yes|No)$/i)))
      items.push({ n: +m[1], yes: m[2].toLowerCase() === "yes" });
    else other.push(line);
  });

  var meta = [scenario, completed].filter(Boolean).join(" · ");
  if (meta) app.appendChild(el("p", "meta", meta));

  if (items.length) {
    var covered = items.filter(function (i) { return i.yes; }).length;
    var summary = el("div", "summary");
    summary.appendChild(el("b", null, covered + " / " + items.length));
    summary.appendChild(el("span", null, "elements of informed consent covered"));
    app.appendChild(summary);
  }

  if (incomplete) {
    app.appendChild(el("div", "warn",
      "Some items could not be graded automatically and are shown as not covered."));
  }

  var list = el("ul");
  items.forEach(function (i) {
    var li = el("li");
    li.appendChild(el("span", "num", i.n + "."));
    li.appendChild(el("span", "name", ITEMS[i.n] || ("Item " + i.n)));
    li.appendChild(el("span", "pill " + (i.yes ? "yes" : "no"), i.yes ? "Covered" : "Not covered"));
    list.appendChild(li);
  });
  other.forEach(function (line) {
    var li = el("li");
    li.appendChild(el("span", "raw", line));
    list.appendChild(li);
  });
  if (items.length || other.length) app.appendChild(list);

  // What Copy puts on the clipboard: the same report, with the item names spelled out.
  var plain = ["ConBo consultation report"];
  if (scenario) plain.push("Scenario: " + scenario);
  if (completed) plain.push("Completed: " + completed);
  if (items.length) plain.push("Covered: " + items.filter(function (i) { return i.yes; }).length + " of " + items.length);
  if (incomplete) plain.push(incomplete);
  plain.push("");
  items.forEach(function (i) {
    plain.push("Item " + i.n + " (" + (ITEMS[i.n] || "?") + "): " + (i.yes ? "Yes" : "No"));
  });
  other.forEach(function (line) { plain.push(line); });
  var plainText = plain.join("\n");

  var button = el("button", null, "Copy results");
  button.type = "button";
  button.addEventListener("click", function () {
    function done(ok) {
      button.textContent = ok ? "Copied" : "Copy failed: select and copy the text instead";
      setTimeout(function () { button.textContent = "Copy results"; }, 2000);
    }
    function fallback() {
      // Older iOS Safari has no async clipboard API; a selected textarea still copies.
      var ta = document.createElement("textarea");
      ta.value = plainText;
      ta.setAttribute("readonly", "");
      ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select(); ta.setSelectionRange(0, plainText.length);
      var ok = false;
      try { ok = document.execCommand("copy"); } catch (e) {}
      document.body.removeChild(ta);
      done(ok);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(plainText).then(function () { done(true); }, fallback);
    } else {
      fallback();
    }
  });
  app.appendChild(button);
  app.appendChild(el("p", "hint", "Your results live in this page's link. Bookmark it to keep them."));
})();
</script>
</body>
</html>
